[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentmint-hermes-runner"
version = "0.11.0"
description = "Route Hermes delegate_task(background=True) to named, persistent AgentMint subagents."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "AgentMint" }]
keywords = ["agentmint", "hermes", "subagents", "delegation", "ai-agents", "mpp", "stripe-link", "tempo"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/mesutcelik/agentmint-hermes"
Repository = "https://github.com/mesutcelik/agentmint-hermes"
Issues = "https://github.com/mesutcelik/agentmint-hermes/issues"

# Auto-attaches the AgentMint adapter to Hermes' `delegate_task` at
# gateway boot. After `pip install` + restart Hermes, the patch is
# live; no edits to Hermes' startup script needed.
[project.entry-points."hermes_agent.plugins"]
agentmint = "agentmint_hermes_runner.autoload"

# One-time interactive setup: pick a payment rail, bootstrap a credit
# wallet, cache the JWT, mint the catch-all `general-worker` subagent.
[project.scripts]
agentmint-hermes-init = "agentmint_hermes_runner.init_cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentmint_hermes_runner"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# Docstrings in examples contain shell-pastable curl payloads that
# must stay on single lines for copy-paste ergonomics. JSON literals
# can't be wrapped across lines without breaking the syntax, so we
# exempt examples/ from the line-length rule.
"examples/*.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
